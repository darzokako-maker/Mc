name: Yahya Cheat Build System
on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'

      - name: Build Agent (JAR)
        run: |
          # Gradle veya Maven komutuyla JAR'ı üretir
          echo "Building JAR..."
          
      - name: Build Bridge & Injector (C++)
        run: |
          # MSVC derleyicisi ile C++ kodlarını derle
          cl.exe /EHsc bridge/bridge.cpp /LD /out:bridge.dll
          cl.exe /EHsc injector/main.cpp /out:YahyaInjector.exe

      - name: Upload Finished Hiles
        uses: actions/upload-artifact@v4
        with:
          name: Stealth-Pack
          path: |
            YahyaInjector.exe
            bridge.dll
            *.jar
            
